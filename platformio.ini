; Golf cart battery dashboard for the ESP32 "Cheap Yellow Display" (ESP32-2432S028)
[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
