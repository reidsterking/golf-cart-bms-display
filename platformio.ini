; Golf cart battery dashboard for the ESP32 "Cheap Yellow Display" (ESP32-2432S028R).
;
;   cyd    : the dashboard firmware, REAL battery data over Bluetooth (default)
;   cyd-demo : same firmware with fake demo data
;   proxy  : BLE protocol logger used to learn the battery module protocol
;   native : desktop build that renders the UI to images, for design review
[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=0
    ; TFT_eSPI configuration for the CYD (ILI9341, HSPI)
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
lib_deps =
    lvgl/lvgl@~8.3.11
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    h2zero/NimBLE-Arduino@^1.4.2

; Same firmware with simulated data, clearly labeled DEMO DATA on screen.
[env:cyd-demo]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DDEMO_DATA=1

[env:proxy]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = -DCORE_DEBUG_LEVEL=0
build_src_filter = -<*> +<../tools/proxy/main.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

; Read-only probe: re-reads the module's data slots and prints changes. Never writes.
[env:probe]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = -DCORE_DEBUG_LEVEL=0
build_src_filter = -<*> +<../tools/probe/main.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

; Active probe: sends a few documented read-type request frames and logs replies.
[env:probe-active]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = -DCORE_DEBUG_LEVEL=0
build_src_filter = -<*> +<../tools/probe_active/main.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

[env:native]
platform = native
build_flags =
    -DNATIVE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -std=gnu++17
build_src_filter = -<*> +<ui/> +<alerts.cpp> +<sim_source.cpp> +<../sim/native_main.cpp>
lib_deps =
    lvgl/lvgl@~8.3.11
